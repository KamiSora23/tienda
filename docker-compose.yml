# Deurstore ERP con Docker. Uso:
#   1) cp .env.docker.example .env   y completa los valores (ver DEPLOY.md)
#   2) docker compose up -d --build
#   3) Abre http://TU-SERVIDOR:${APP_PORT}
name: deurstore

x-api: &api
  build:
    context: .
    dockerfile: docker/api/Dockerfile
  image: deurstore-api:latest
  env_file: .env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    LOG_CHANNEL: stderr
  volumes:
    - storage:/var/www/html/storage/app
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Lima
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # API Laravel: aplica las migraciones al arrancar.
  api:
    <<: *api
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      LOG_CHANNEL: stderr
      RUN_MIGRATIONS: "true"
    # «healthy» cuando Laravel responde (la primera vez tarda por las migraciones).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  # Tareas programadas: respaldos automáticos, reportes programados, etc.
  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: deurstore-web:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Única puerta de entrada: /api → Laravel, el resto → interfaz.
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Arranca aunque la API o la web sigan iniciando: mientras tanto muestra «El sistema está iniciando».
    depends_on:
      - api
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/proxy-health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  db_data:
  storage:
