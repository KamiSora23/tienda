# Una sola dirección para todo: /api/ va a Laravel y el resto a la interfaz web.

# Si hay otro proxy delante con HTTPS (Cloudflare, Caddy, Nginx Proxy Manager…) se respeta su esquema.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 24m;

    # DNS interno de Docker, consultado en cada petición: nginx arranca aunque la API o la web
    # todavía estén iniciando (antes se caía y cortaba las conexiones).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:80;
    set $web_upstream http://web:3000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 10s;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_read_timeout 300s;
    }

    location = /up {
        proxy_pass $api_upstream;
    }

    location / {
        proxy_pass $web_upstream;
    }

    # Mientras algún servicio arranca, una página clara en lugar de una conexión cortada.
    error_page 502 503 504 = @starting;
    location @starting {
        default_type text/html;
        add_header Retry-After 15 always;
        return 503 '<!doctype html><html lang="es"><meta charset="utf-8"><meta http-equiv="refresh" content="15"><title>Iniciando…</title><body style="font-family:sans-serif;display:grid;place-items:center;height:90vh;color:#17211c"><div style="text-align:center"><h1>El sistema está iniciando</h1><p>Vuelve a intentarlo en unos segundos. Esta página se recarga sola.</p></div></body></html>';
    }

    location = /proxy-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
